services:
  postgres:
    image: postgres:16
    container_name: kod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kod
      POSTGRES_USER: kod
      POSTGRES_PASSWORD: kod_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kod-net

  redis:
    image: redis:7
    container_name: kod-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kod-net

  app:
    image: laravel-php:latest
    container_name: kod-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_KEY: base64:veHV69ATG2CDlw4LAzBV0JYNqlLAI9RTJgw/OEerheg=
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - kod-net

  nginx:
    image: nginx:latest
    container_name: kod-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - kod-net

  minio:
    image: minio/minio:latest
    container_name: kod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kod-net

  minio-init:
    image: minio/mc:latest
    container_name: kod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin_secret;
      mc mb --ignore-existing local/kod-uploads;
      mc anonymous set public local/kod-uploads;
      echo 'MinIO bucket ready';
      exit 0;
      "
    networks:
      - kod-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  kod-net:
    driver: bridge
