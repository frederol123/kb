services:
  postgres:
    image: postgres:16-alpine
    container_name: kod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kod
      POSTGRES_USER: kod
      POSTGRES_PASSWORD: kod_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kod-net

  redis:
    image: redis:7-alpine
    container_name: kod-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kod-net

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kod-app:latest
    container_name: kod-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kod-net

  nginx:
    image: nginx:alpine
    container_name: kod-nginx
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - kod-net

volumes:
  postgres_data:
  redis_data:

networks:
  kod-net:
    driver: bridge
